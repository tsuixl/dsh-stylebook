 for(const {key,name} of colorFields){$('color-'+key).addEventListener('input',event=>{config.palettes[effectiveMode()][key]=event.target.value;update();});$('hex-'+key).addEventListener('input',event=>{let value=event.target.value.trim();if(!value.startsWith('#'))value='#'+value;if(/^#[\da-f]{6}$/i.test(value)){config.palettes[effectiveMode()][key]=value.toLowerCase();update();}});$('hex-'+key).addEventListener('change',event=>{let value=event.target.value.trim();if(value==='')value=defaults.palettes[effectiveMode()][key];if(!value.startsWith('#'))value='#'+value;if(/^#[\da-f]{3}$/i.test(value))value='#'+[...value.slice(1)].map(c=>c+c).join('');if(!/^#[\da-f]{6}$/i.test(value)){toast(name+'：请输入有效的 HEX 色值');apply();return;}config.palettes[effectiveMode()][key]=value.toLowerCase();update();});}
 $('reset').addEventListener('click',()=>{config=clone(defaults);selectedPreset='default';renderPresets();update();toast('已恢复默认外观，保存的方案仍然保留');});
 $('save-preset').addEventListener('click',()=>{closeFont();closeChoice();lastDialogFocus=document.activeElement;$('save-overlay').hidden=false;$('settings-window').inert=true;$('preset-name').value='';$('preset-error').textContent='';$('preset-name').focus();});
 function closeSave(){$('save-overlay').hidden=true;$('settings-window').inert=false;lastDialogFocus?.focus();}
 $('cancel-save').addEventListener('click',closeSave);
 $('save-form').addEventListener('submit',event=>{event.preventDefault();const name=$('preset-name').value.trim();if(!name){$('preset-error').textContent='给这个方案起个名字吧。';return;}if([...builtins,...customPresets].some(p=>p.name===name)){$('preset-error').textContent='已有同名方案，请换一个名称。';return;}const id='custom-'+Date.now().toString(36);customPresets.push({id,name,value:clone(config)});selectedPreset=id;renderPresets();update();closeSave();toast('方案 “'+name+'” 已保存');});
 $('delete-preset').addEventListener('click',()=>{const deleted=customPresets.find(p=>p.id===selectedPreset);if(!deleted)return;customPresets=customPresets.filter(p=>p.id!==selectedPreset);selectedPreset='default';renderPresets();update();toast('已删除方案，当前外观保持不变');});
 $('font-search').addEventListener('input',renderFonts);
 $('font-search').addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();$('font-list').querySelector('button')?.focus();}else if(event.key==='Enter'){event.preventDefault();$('font-list').querySelector('button')?.click();}});
 $('font-list').addEventListener('keydown',event=>{const items=[...$('font-list').querySelectorAll('button')],i=items.indexOf(document.activeElement);if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();items[(i+(event.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}});
 $('load-system-fonts').addEventListener('click',async()=>{if(typeof window.queryLocalFonts!=='function'){$('font-message').textContent='当前环境不支持读取系统字体。可输入名称，或在桌面版 Chrome / Edge 中打开。';return;}const button=$('load-system-fonts');button.disabled=true;try{const available=await window.queryLocalFonts();fonts=[...new Set(available.map(font=>font.family).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));fontsLoaded=true;if(activeFontRole)renderFonts();$('font-message').textContent='已读取 '+fonts.length+' 个字体家族。字体只在本机使用。';positionFont();}catch(error){$('font-message').textContent='未获得字体读取权限。你仍可直接输入字体名称。';}finally{button.disabled=false;}});
 $('open-settings').addEventListener('click',openSettings);document.querySelectorAll('[data-open-settings]').forEach(button=>button.addEventListener('click',openSettings));document.querySelectorAll('[data-close-settings]').forEach(button=>button.addEventListener('click',closeSettings));
 document.addEventListener('pointerdown',event=>{if(!$('font-popover').hidden&&!$('font-popover').contains(event.target)&&!event.target.closest('[data-font-role]'))closeFont();if(!$('choice-popover').hidden&&!$('choice-popover').contains(event.target)&&!choiceTrigger?.contains(event.target))closeChoice();});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('save-overlay').hidden){closeSave();return;}if(!$('choice-popover').hidden){const trigger=choiceTrigger;closeChoice();trigger?.focus();return;}if(!$('font-popover').hidden){const trigger=fontTrigger;closeFont();trigger?.focus();return;}if(!$('settings-backdrop').hidden)closeSettings();return;}if(event.key==='Tab'){const modal=!$('save-overlay').hidden?$('save-overlay'):!$('settings-backdrop').hidden?(!$('font-popover').hidden?$('font-popover'):!$('choice-popover').hidden?$('choice-popover'):$('settings-window')):null;if(!modal)return;const focusables=[...modal.querySelectorAll('button:not(:disabled),input,select')].filter(el=>el.getClientRects().length>0&&!el.closest('[hidden]'));if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){event.preventDefault();first.focus();}}});
 $('settings-scroll').addEventListener('scroll',()=>{closeFont();closeChoice();});window.addEventListener('resize',()=>{closeFont();closeChoice();});systemMedia.addEventListener('change',()=>{if(config.mode==='system')apply();});window.addEventListener('pagehide',persist);
 renderPresets();apply();$('full-workspace').inert=true;if(!storageAvailable)$('save-status').querySelector('span').textContent='仅本次预览有效';
})();
</script>
</body>
</html>
